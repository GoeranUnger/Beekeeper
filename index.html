<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stockkarte">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9D%3C/text%3E%3C/svg%3E">
<title>Stockkarte – Bienenvölker</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f7;--fg:#14181f;--mut:#667085;--card:#fff;--line:#e4e7ec;--acc:#f5b301;--on:#1a1400;--g:#12b76a;--b:#2e90fa;--r:#d92d20;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--fg:#eef1f5;--mut:#98a2b3;--card:#171b22;--line:#262c36;--sh:none;--g:#32d583;--b:#53b1fd;--r:#f97066}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
main{max-width:720px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:12px 0 2px}
h2{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
small,.mut{color:var(--mut)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);width:100%;min-height:50px;font-size:1.05rem;margin-top:4px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;margin:0 -14px 12px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--bg)}
.tabs button{flex:none;border-radius:999px}
.tabs .on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button[data-add]{border-style:dashed;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.head h2{margin:0;font-size:1.3rem}
.icon{flex:none;width:44px;padding:0;display:grid;place-items:center}
.danger{color:var(--r)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.tile b{display:block;font-size:1.1rem;letter-spacing:-.02em}
.tile span{display:block;font-size:.78rem;line-height:1.25;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{grid-template-columns:1fr 1fr}.two .full{grid-column:1/-1}
label{display:block;font-size:.82rem;font-weight:600;color:var(--mut)}
input,select{display:block;width:100%;min-height:48px;margin-top:4px;padding:8px 12px;font-size:16px;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px}
.chips button{flex:none;border-radius:999px;background:var(--bg);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin:-4px 0 6px}
.legend i,.ent::before{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.legend i{margin-right:5px}
i.f,.ent.f::before{background:var(--acc)}i.v,.ent.v::before{background:var(--g)}i.g,.ent.g::before{background:var(--b)}
ul.list{list-style:none;margin:0;padding:0}
.ent{position:relative;padding:12px 0 12px 22px;border-bottom:1px solid var(--line)}
.ent:last-child{border-bottom:0}
.ent::before{content:"";position:absolute;left:0;top:19px}
.eh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eh .del{min-width:44px;border:0;background:none;color:var(--mut);font-size:1.1rem}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{background:var(--bg);border-radius:999px;padding:2px 10px;font-size:.88rem;font-weight:600}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:1.05rem;font-weight:700}
@media(min-width:700px){button.pri{width:auto}.tiles b{font-size:1.4rem}}
</style>
</head>
<body>
<main>
<h1>Stockkarte Bienenvölker</h1>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
<div class="card">
  <h2>Daten sichern</h2>
  <small>Die Daten liegen nur in diesem Browser. Exportiere sie regelmäßig als Datei.</small>
  <div class="row">
    <button id="exp">Exportieren (JSON)</button>
    <button id="imp">Importieren</button>
    <input type="file" id="file" accept=".json" hidden>
    <button id="reset">Auf Ausgangsdaten zurücksetzen</button>
  </div>
</div>
</main>
<script>
const KEY="stockkarte-v1";
const parse=(s)=>s.trim().split("\n").map((l,i)=>{const[d,t,f,v,g]=l.split("|");const[dd,mm,yy]=d.split(".");
  return{id:"s"+i+Math.random().toString(36).slice(2,6),datum:`${yy}-${mm}-${dd}`,text:t||"",futter:f||"",varroa:v||"",gewicht:g||""}});
const SEED=()=>({aktiv:0,voelker:[
{id:"v1",name:"1 / Mareen Arends & Dennis Leisdon",standort:"Kläranlage Uelsen WAZ, Zur Kläranlage 1, 49843 Uelsen",beute:"1",einheit:"Liter",
 koenigin:{jahrgang:"unklar",gezeichnet:"Nein",herkunft:"Bienenschwarm 2025"},eintraege:parse(`10.05.2025|Aus Itterbeck
28.07.2025|Futter|2
30.07.2025|Futter|2
31.07.2025|Api Life Var||1 Streifen
04.08.2025|Futter|2
07.08.2025|Futter|2
08.08.2025|Api Life Var||1 Streifen
11.08.2025|Futter|2
14.08.2025|Futter|2
19.08.2025|Futter|2
01.09.2025|VarroMed||15ml
09.09.2025|VarroMed||15ml
15.09.2025|VarroMed||15ml
08.12.2025|VarroMed||15ml
08.06.2026|Brutwabe hinzugeben
29.07.2026|Futter|1
30.07.2026|Api Life Var||1 Streifen
31.07.2026|Futter|1
02.08.2026|Futter|2
05.08.2026|Api Life Var||1 Streifen
05.08.2026|Futter|2
09.08.2026|Futter|2
13.08.2026|Api Life Var||1 Streifen
13.08.2026|Futter|2
20.08.2026|Api Life Var||1 Streifen
20.08.2026|Futter|0,75
27.08.2026|Futter|2
04.09.2026|VarroMed||15ml
04.09.2026|Futter|2
10.09.2026|VarroMed||20ml
10.09.2026|Futter|2
17.09.2026|VarroMed||20ml
17.09.2026|Futter|2
19.09.2026|Futterkranzprobe + 2 Stock aufgesetzt
20.09.2026|Futter|2
24.09.2026|Futter|2
24.09.2026|VarroMed||20ml
01.10.2026|Futter|2
01.10.2026|VarroMed||20ml
08.10.2026|Futter|2
08.10.2026|VarroMed||15ml
14.10.2026|Futter|2||32`)},
{id:"v2",name:"2 / Mareen Arends & Dennis Leisdon",standort:"Kläranlage Uelsen WAZ, Zur Kläranlage 1, 49843 Uelsen",beute:"1",einheit:"kg",
 koenigin:{jahrgang:"unklar",gezeichnet:"Nein",herkunft:"Bienenschwarm 2026"},eintraege:parse(`08.06.2026|Aus Neuenhaus
29.07.2026|Futter|1
30.07.2026|Api Life Var||1 Streifen
31.07.2026|Futter|1
02.08.2026|Futter|2
05.08.2026|Api Life Var||1 Streifen
05.08.2026|Futter|2
09.08.2026|Futter|2
13.08.2026|Api Life Var||1 Streifen
13.08.2026|Futter|2
20.08.2026|Api Life Var||1 Streifen
20.08.2026|Futter|1,5
27.08.2026|Futter|2
04.09.2026|VarroMed||20ml
04.09.2026|Futter|2
10.09.2026|VarroMed||15ml
10.09.2026|Futter|2
17.09.2026|VarroMed||15ml
17.09.2026|Futter|2
19.09.2026|Futterkranzprobe + 2 Stock aufgesetzt
20.09.2026|Futter|2
24.09.2026|Futter|2
24.09.2026|VarroMed||15ml
01.10.2026|Futter|2
01.10.2026|VarroMed||20ml
08.10.2026|Futter|2
08.10.2026|VarroMed||15ml
14.10.2026|Futter|2||32`)}]});

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.voelker)S=SEED();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(s)=>parseFloat(String(s).replace(",","."))||0;
const fmtD=(iso)=>iso.split("-").reverse().join(".");
const fmtN=(n)=>n.toLocaleString("de-DE",{maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);

function render(){
  $("tabs").innerHTML=S.voelker.map((v,i)=>`<button class="${i===S.aktiv?"on":""}" data-t="${i}">Volk ${esc(v.name.split("/")[0].trim())}</button>`).join("")+`<button data-add>+ Neues Volk</button>`;
  const v=S.voelker[S.aktiv];
  if(!v){$("view").innerHTML=`<div class="card">Noch kein Volk angelegt. Lege mit „+ Neues Volk“ das erste an.</div>`;return}
  const e=[...v.eintraege].sort((a,b)=>b.datum.localeCompare(a.datum));
  const futter=e.reduce((s,x)=>s+num(x.futter),0);
  const gew=e.find(x=>x.gewicht);
  const varr=e.find(x=>x.varroa);
  $("view").innerHTML=`
  <div class="head"><div><h2>${esc(v.name)}</h2><small>${esc(v.standort.split(",")[0]||"Kein Standort angegeben")}</small></div><button class="icon danger" data-delv aria-label="Volk löschen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg></button></div>
  <div class="tiles">
    <div class="tile"><b>${fmtN(futter)} ${esc(v.einheit)}</b><span>Futter gesamt</span></div>
    <div class="tile"><b>${gew?esc(gew.gewicht)+" kg":"–"}</b><span>${gew?"Gewicht am "+fmtD(gew.datum).slice(0,6):"Kein Gewicht"}</span></div>
    <div class="tile"><b>${varr?fmtD(varr.datum).slice(0,6):"–"}</b><span>Letzte Varroa-Maßnahme</span></div>
  </div>
  <div class="card"><h2>Neuer Eintrag</h2>
  <div class="chips"><button data-chip="Futter">Futter</button><button data-chip="Api Life Var">Api Life Var</button><button data-chip="VarroMed">VarroMed</button><button data-chip="Durchsicht">Durchsicht</button><button data-chip="Futterkranzprobe">Futterkranzprobe</button></div>
  <div class="grid two">
    <label class="full">Datum<input type="date" id="n-d" value="${today()}"></label>
    <label class="full">Beobachtung / Arbeit<input id="n-t" autocomplete="off"></label>
    <label>Gefüttert (${esc(v.einheit)})<input id="n-f" inputmode="decimal"></label>
    <label>Gewicht (kg)<input id="n-g" inputmode="decimal"></label>
    <label class="full">Maßnahme Varroa<input id="n-v" placeholder="z. B. 15ml oder 1 Streifen" autocomplete="off"></label>
  </div>
  <div class="row"><button class="pri" data-new>Eintrag speichern</button></div></div>
  <div class="card"><h2>Stockkarte</h2><div class="legend"><span><i class="f"></i>Futter</span><span><i class="v"></i>Varroa</span><span><i class="g"></i>Gewicht</span></div>${e.length?`<ul class="list">`+e.map(x=>`<li class="ent ${x.varroa?"v":x.gewicht?"g":x.futter?"f":""}"><div class="eh"><b>${fmtD(x.datum)}</b><button class="del" data-del="${x.id}" aria-label="Eintrag vom ${fmtD(x.datum)} löschen">✕</button></div>${x.text?`<div>${esc(x.text)}</div>`:""}<div class="tags">${x.futter?`<span>${esc(x.futter)} ${esc(v.einheit)}</span>`:""}${x.varroa?`<span>${esc(x.varroa)}</span>`:""}${x.gewicht?`<span class="g">${esc(x.gewicht)} kg</span>`:""}</div></li>`).join("")+`</ul>`:`<small>Noch keine Einträge.</small>`}</div>
  <details class="card"><summary>Volk &amp; Königin</summary><div class="grid">
    <label>Volk Nr./Name<input data-f="name" value="${esc(v.name)}"></label>
    <label>Standort<input data-f="standort" value="${esc(v.standort)}"></label>
    <label>Beute<input data-f="beute" value="${esc(v.beute)}"></label>
    <label>Futtereinheit<select data-f="einheit"><option${v.einheit==="Liter"?" selected":""}>Liter</option><option${v.einheit==="kg"?" selected":""}>kg</option></select></label>
    <label>Königin Jahrgang<input data-q="jahrgang" value="${esc(v.koenigin.jahrgang)}"></label>
    <label>Königin gezeichnet<select data-q="gezeichnet"><option${v.koenigin.gezeichnet==="Nein"?" selected":""}>Nein</option><option${v.koenigin.gezeichnet==="Ja"?" selected":""}>Ja</option></select></label>
    <label>Königin Herkunft<input data-q="herkunft" value="${esc(v.koenigin.herkunft)}"></label>
  </div></details>`;
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const v=S.voelker[S.aktiv];
  if(b.dataset.t!==undefined)S.aktiv=+b.dataset.t;
  else if("add" in b.dataset){const n=prompt("Name des neuen Volks (z. B. 3 / Name):");if(!n)return;
    S.voelker.push({id:"v"+Date.now(),name:n,standort:"",beute:"1",einheit:"Liter",koenigin:{jahrgang:"",gezeichnet:"Nein",herkunft:""},eintraege:[]});S.aktiv=S.voelker.length-1}
  else if("delv" in b.dataset){if(!confirm("Volk „"+v.name+"“ mit allen "+v.eintraege.length+" Einträgen endgültig löschen?"))return;S.voelker.splice(S.aktiv,1);S.aktiv=0}
  else if(b.dataset.chip){const c=b.dataset.chip;$("n-t").value=c;$(c==="Futter"?"n-f":c==="Api Life Var"||c==="VarroMed"?"n-v":"n-t").focus();return}
  else if(b.dataset.del){if(!confirm("Diesen Eintrag löschen?"))return;v.eintraege=v.eintraege.filter(x=>x.id!==b.dataset.del)}
  else if("new" in b.dataset){const d=$("n-d").value;if(!d){alert("Bitte ein Datum angeben.");return}
    const t=$("n-t").value.trim(),f=$("n-f").value.trim(),va=$("n-v").value.trim(),g=$("n-g").value.trim();
    if(!t&&!f&&!va&&!g){alert("Bitte mindestens eine Angabe machen.");return}
    v.eintraege.push({id:"e"+Date.now(),datum:d,text:t||(f?"Futter":""),futter:f,varroa:va,gewicht:g})}
  else if(b.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download=`stockkarte-${today()}.json`;a.click();return}
  else if(b.id==="imp"){$("file").click();return}
  else if(b.id==="reset"){if(!confirm("Alle Änderungen verwerfen und die Ausgangsdaten laden?"))return;S=SEED()}
  else return;
  save();render();
});
document.addEventListener("change",ev=>{
  const t=ev.target,v=S.voelker[S.aktiv];
  if(t.id==="file"){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.voelker))throw 0;S=d;S.aktiv=0;save();render()}catch(e){alert("Die Datei ist keine gültige Stockkarten-Sicherung.")}};r.readAsText(t.files[0]);t.value="";return}
  if(t.dataset.f){v[t.dataset.f]=t.value;save();if(t.dataset.f!=="standort")render()}
  if(t.dataset.q){v.koenigin[t.dataset.q]=t.value;save()}
});
render();
</script>
</body>
</html>
