<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4d3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stockkarte">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9D%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <title>Stockkarte – Bienenvölker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 class="titel">
      <span class="biene">🐝</span>
      Bienenvölker
    </h1>
    <nav class="tabs" id="tabs" aria-label="Völker"></nav>
    <div id="kopf"></div>
    <details class="card" id="stamm"></details>
    <section class="card" id="formular"></section>
    <section class="card" id="diagramm"></section>
    <details class="card" id="liste" close></details>

    <section class="card">
      <h2>Daten sichern</h2>
      <small>Die Daten liegen nur in diesem Browser. Exportiere sie regelmäßig als Datei.</small>
      <div class="row">
        <button data-aktion="exportieren">Exportieren (JSON)</button>       
        <button data-aktion="importieren">Importieren</button>
        <button data-aktion="zuruecksetzen">Daten zurücksetzen</button>
      </div>
    </section>
  </main>
  <input type="file" id="datei" accept=".json" hidden>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
